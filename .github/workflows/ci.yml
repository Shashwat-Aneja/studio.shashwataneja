name: Studio quality checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/studio-foundation]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Typecheck and production build
        run: npm run build
